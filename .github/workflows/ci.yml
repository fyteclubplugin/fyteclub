# Builds the plugin against a real Dalamud install and runs unit tests.
# RealP2P tests are slow/network-dependent, gated behind manual workflow_dispatch.
# dalamud-staging-canary builds against Dalamud's staging branch to catch API breaks early.

name: CI — build & tests

on:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DALAMUD_DISTRIB_URL: 'https://goatcorp.github.io/dalamud-distrib/latest.zip'
  DALAMUD_DISTRIB_STAGING_URL: 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip'

concurrency:
  group: fyteclub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests (required)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (release channel)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\dalamud"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "$env:DALAMUD_DISTRIB_URL" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dest -Force
          echo "DALAMUD_HOME=$dest" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build vendored MR-WebRTC (fast / deterministic)
        run: dotnet build Microsoft.MixedReality.WebRTC/Microsoft.MixedReality.WebRTC.csproj -c Release
        timeout-minutes: 10

      - name: Build plugin (required)
        run: dotnet build plugin/FyteClub.csproj -c Release
        timeout-minutes: 12

      - name: Build & run unit tests (required, exclude RealP2P)
        run: |
          dotnet test plugin-tests/plugin-tests.csproj `
            --filter "Category!=RealP2P" `
            --logger "trx;LogFileName=unit-test-results.trx" `
            --results-directory ./TestResults
        timeout-minutes: 20

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/**/*.trx

  dalamud-staging-canary:
    name: Dalamud staging canary (allowed to fail)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (staging channel)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\dalamud-stg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "$env:DALAMUD_DISTRIB_STAGING_URL" -OutFile "$env:RUNNER_TEMP\dalamud-stg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud-stg.zip" -DestinationPath $dest -Force
          echo "DALAMUD_HOME=$dest" >> $env:GITHUB_ENV

      - name: Build plugin against Dalamud staging
        run: dotnet build plugin/FyteClub.csproj -c Release
        timeout-minutes: 12

  realp2p-manual:
    name: Real P2P (manual / gated)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (release channel)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\dalamud"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "$env:DALAMUD_DISTRIB_URL" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dest -Force
          echo "DALAMUD_HOME=$dest" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build plugin/FyteClub.csproj -c Release

      - name: Run RealP2P integration tests
        # separate processes per class - running them together hangs, shared static state in WebRTCConnectionFactory/mrwebrtc.dll isn't reentrant
        run: |
          dotnet test plugin-tests/plugin-tests.csproj `
            --no-build `
            --filter "FullyQualifiedName~LocalTwoPeerConnectionTests" `
            --logger "trx;LogFileName=realp2p-local-two-peer-results.trx" `
            --results-directory ./TestResults
          dotnet test plugin-tests/plugin-tests.csproj `
            --no-build `
            --filter "FullyQualifiedName~SyncshellIntegrationTests" `
            --logger "trx;LogFileName=realp2p-syncshell-integration-results.trx" `
            --results-directory ./TestResults
        timeout-minutes: 20

      - name: Upload RealP2P results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realp2p-test-results
          path: TestResults/**/*.trx
