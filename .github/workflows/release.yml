name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DALAMUD_DISTRIB_URL: 'https://goatcorp.github.io/dalamud-distrib/latest.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Download Dalamud (release channel)
      shell: pwsh
      run: |
        $dest = "$env:RUNNER_TEMP\dalamud"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Invoke-WebRequest -Uri "$env:DALAMUD_DISTRIB_URL" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
        Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dest -Force
        echo "DALAMUD_HOME=$dest" >> $env:GITHUB_ENV

    - name: Build vendored MR-WebRTC
      run: dotnet build Microsoft.MixedReality.WebRTC/Microsoft.MixedReality.WebRTC.csproj -c Release

    - name: Build Plugin
      run: dotnet build plugin/FyteClub.csproj -c Release

    - name: Package Plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "FyteClub-Plugin" | Out-Null
        Copy-Item "plugin\bin\Release\win-x64\FyteClub.dll" "FyteClub-Plugin\"
        Copy-Item "plugin\FyteClub.json" "FyteClub-Plugin\"
        Copy-Item "README.md" "FyteClub-Plugin\" -ErrorAction SilentlyContinue
        Compress-Archive -Path "FyteClub-Plugin\*" -DestinationPath "FyteClub-Plugin.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: FyteClub ${{ steps.version.outputs.VERSION }}
        body: |
          ## FyteClub Release ${{ steps.version.outputs.VERSION }}

          ### Install
          Add the third-party repo `https://raw.githubusercontent.com/fyteclubplugin/fyteclub/main/plugin/repo.json` in Dalamud's Plugin Installer settings, or download `FyteClub-Plugin.zip` below and load manually.

          See docs/PLAN.md and README.md for details.
        files: |
          FyteClub-Plugin.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
